[project]
name = "nova-papers"
version = "0.1.0"
description = "A citation-first paper Q&A demo powered by GLM"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "pymupdf>=1.25,<2",
  "rank-bm25>=0.2.2,<0.3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
